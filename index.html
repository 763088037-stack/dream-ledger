<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>梦幻收益管家 v0.1</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background: #F6F5F2;
    color: #2C2C2A;
    font-family: system-ui, -apple-system, "Microsoft YaHei", sans-serif;
    font-size: 14px;
    line-height: 1.6;
    padding: 48px 20px;
  }
  .wrap { max-width: 720px; margin: 0 auto; }

  h1 { font-size: 22px; font-weight: 500; letter-spacing: -0.01em; }
  .date { color: #918E87; font-size: 13px; margin-top: 4px; }

  table {
    width: 100%;
    border-collapse: collapse;
    margin-top: 28px;
    background: #fff;
    border: 1px solid #E5E2DC;
    border-radius: 12px;
    overflow: hidden;
  }
  th, td { padding: 12px 16px; text-align: left; }
  th {
    font-size: 12px;
    font-weight: 500;
    color: #5F5E5A;
    background: #FAF9F7;
    border-bottom: 1px solid #E5E2DC;
  }
  td { border-bottom: 1px solid #EFEDE8; }
  tr:last-child td { border-bottom: none; }

  .num {
    text-align: right;
    font-variant-numeric: tabular-nums;
  }

  .summary {
    display: flex;
    gap: 12px;
    margin-top: 20px;
    flex-wrap: wrap;
  }
  .stat {
    flex: 1;
    min-width: 150px;
    background: #fff;
    border: 1px solid #E5E2DC;
    border-radius: 12px;
    padding: 16px 18px;
  }
  .stat .label { font-size: 12px; color: #918E87; }
  .stat .value {
    font-size: 26px;
    font-weight: 500;
    letter-spacing: -0.02em;
    margin-top: 2px;
  }
  .stat .value span { font-size: 13px; color: #5F5E5A; margin-left: 3px; }
  .stat.highlight { background: #E1F5EE; border-color: #9FE1CB; }
  .stat.highlight .label { color: #0F6E56; }
  .stat.highlight .value { color: #085041; }
  .stat.highlight .value span { color: #0F6E56; }

  .note {
    margin-top: 24px;
    font-size: 12px;
    color: #918E87;
    line-height: 1.7;
  }
</style>
</head>
<body>
<div class="wrap">
  <h1>梦幻收益管家</h1>
  <p class="date">2026-10-19 · 今日五开记录</p>

  <table>
    <thead>
      <tr>
        <th>角色</th>
        <th>门派</th>
        <th>今日任务</th>
        <th class="num">收入（万）</th>
        <th class="num">耗时（分）</th>
      </tr>
    </thead>
    <tbody>
      <tr>
        <td>剑走偏锋</td>
        <td>大唐官府</td>
        <td>师门 + 捉鬼</td>
        <td class="num">28</td>
        <td class="num">150</td>
      </tr>
      <tr>
        <td>一念花开</td>
        <td>化生寺</td>
        <td>师门 + 宝图</td>
        <td class="num">22</td>
        <td class="num">120</td>
      </tr>
      <tr>
        <td>清风不识字</td>
        <td>方寸山</td>
        <td>师门</td>
        <td class="num">12</td>
        <td class="num">60</td>
      </tr>
      <tr>
        <td>海阔天空</td>
        <td>龙宫</td>
        <td>捉鬼</td>
        <td class="num">18</td>
        <td class="num">90</td>
      </tr>
      <tr>
        <td>魔王在此</td>
        <td>魔王寨</td>
        <td>师门</td>
        <td class="num">8</td>
        <td class="num">45</td>
      </tr>
    </tbody>
  </table>

  <div class="summary">
    <div class="stat">
      <div class="label">今日总收入</div>
      <div class="value">88<span>万梦幻币</span></div>
    </div>
    <div class="stat">
      <div class="label">总耗时</div>
      <div class="value">7.75<span>小时</span></div>
    </div>
    <div class="stat highlight">
      <div class="label">每小时收益</div>
      <div class="value">11.4<span>万 / 小时</span></div>
    </div>
  </div>

  <p class="note">
    v0.1：所有数字都是手写的，合计和时薪也是手算的。<br>
    下一步要做的，是让它自己算出来。
  </p>
</div>
</body>
</html>
